<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Website</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow-x:hidden;
    font-family:Arial;
}

/* الصفحة الأولى */
.hero{
    width:100%;
    height:100vh;
    background:black;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:60px;
}

/* قسم الفيديو */
.video-section{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

.video-section video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.video-text{
    position:absolute;
    top:0;
    left:0;

    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:50px;

    background:rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<section class="hero">
    الصفحة الرئيسية
</section>

<section class="video-section">

    <video autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="video-text">
        مرحباً بك
    </div>

</section>

</body>
</html>
