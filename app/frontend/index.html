<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fullscreen Video</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    overflow-x:hidden;
}

/* الصفحة الرئيسية */
.hero{
    height:100vh;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
}

/* قسم الفيديو */
.video-section{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

video-section video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.video-overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.3);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:40px;
}

</style>
</head>

<body>

<!-- الصفحة الرئيسية -->
<section class="hero">
    الصفحة الرئيسية
</section>

<!-- صفحة الفيديو -->
<section class="video-section">

    <video autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="video-overlay">
        مرحباً بك
    </div>

</section>

</body>
</html>
