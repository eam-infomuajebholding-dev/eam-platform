name: CI

on:
  push:
    branches: [main, master, develop, 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest
        env:
          JWT_SECRET_KEY: ci-test-jwt-secret
          JWT_EXPIRE_MINUTES: '60'
          JWT_ALGORITHM: HS256
          DATABASE_URL: sqlite:///./ci_test.db
        run: python -m pytest -q

  alembic-single-head:
    name: alembic-single-head
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify single Alembic head
        run: |
          heads=$(alembic heads | wc -l | tr -d ' ')
          if [ "$heads" != "1" ]; then
            echo "Expected 1 Alembic head, found $heads"
            alembic heads
            exit 1
          fi

  frontend-lint:
    name: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build

  credential-free-e2e:
    name: credential-free-e2e
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install backend dependencies
        working-directory: app/backend
        run: pip install -r requirements.txt
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Build frontend for preview
        run: pnpm run build
      - name: Run credential-free E2E
        env:
          JWT_SECRET_KEY: ci-test-jwt-secret
          JWT_EXPIRE_MINUTES: '60'
          JWT_ALGORITHM: HS256
          DATABASE_URL: sqlite:///./ci_e2e.db
          ENVIRONMENT: dev
        run: |
          cd ../backend
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          BACKEND_PID=$!
          cd ../frontend
          pnpm exec vite preview --host 127.0.0.1 --port 3000 &
          FRONTEND_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && curl -sf http://127.0.0.1:3000 >/dev/null && break
            sleep 2
          done
          pnpm exec playwright test e2e/homepage-geometry.spec.ts e2e/m1-auth-smoke.spec.ts e2e/sector-registry.spec.ts e2e/query-cache-keys.spec.ts e2e/command-center.spec.ts e2e/command-center-visual.spec.ts
          kill $BACKEND_PID $FRONTEND_PID || true
